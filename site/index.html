<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070605">
<title>NYC Dive-Bar Pool Room: Opening Chapter</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --room-black: #070605;
    --shot-gap: clamp(12px, 2.5vw, 40px);
    --page-edge: clamp(0px, 1.5vw, 24px);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-width: 320px;
    background: var(--room-black);
  }

  .chapter {
    width: min(100%, 1600px);
    margin: 0 auto;
    padding-top: max(var(--page-edge), env(safe-area-inset-top));
    padding-right: max(var(--page-edge), env(safe-area-inset-right));
    padding-bottom: max(var(--page-edge), env(safe-area-inset-bottom));
    padding-left: max(var(--page-edge), env(safe-area-inset-left));
  }

  .shot {
    margin: 0 0 var(--shot-gap);
    overflow: hidden;
    background: #000;
  }

  .shot:last-child {
    margin-bottom: 0;
  }

  .shot img,
  .shot video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
</style>
</head>
<body>
<main class="chapter" aria-label="NYC dive-bar pool room">
  <figure class="shot">
    <video src="break-film.mp4" poster="img/break-film-poster.webp"
           width="1920" height="1080" controls preload="metadata"
           playsinline
           aria-label="Thirty-second break: the room, the address, and the
                       rack scattering in real time"></video>
  </figure>
  <figure class="shot">
    <img src="img/opening/01-street-neon.webp"
         alt="Rain-lit Lower East Side storefronts seen through a diamond-latticed bar window and an open neon sign"
         width="1600" height="900" loading="eager" fetchpriority="high"
         decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/02-threshold.webp"
         alt="First step inside the bar, looking past mismatched stools and booths toward the pool table"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/03-front-room.webp"
         alt="Front room with small tables, mismatched chairs, the bar, and a glowing street window"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/04-bar-reveal.webp"
         alt="Pool-table corner framing a stocked back bar, old register, fruit bowl, and neon street window"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/05-clean-bar.webp"
         alt="Wiped, worn bar top with fruit, old metal register, bottle shelves, and a coaster-set drink"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/06-patron-barware.webp"
         alt="Pint and rocks glasses with beer, lime, straw, coasters, and the footprint of patrons at the bar"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/07-booths.webp"
         alt="Small run of adjacent aged-vinyl booths with worn wood tables and drinks set on coasters"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/08-booth-patina.webp"
         alt="Close view of cracked booth vinyl, decades-worn tabletop finish, beer, cocktail, and coasters"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/09-wall-history.webp"
         alt="Faded posters and paper remnants wheat-pasted across an old patched bar wall"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/10-bathroom-door.webp"
         alt="Sticker-covered bathroom door set into patched plaster and dark painted wainscoting"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/11-pool-light.webp"
         alt="Low three-shade classic billiard fixture suspended over the table beneath the old ceiling"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/12-room-hero.webp"
         alt="Long room view from the bar rail toward the lit pool table and stickered bathroom door"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/13-table-hero.webp"
         alt="Three-quarter view of the rebuilt nine-foot table, six pockets, rails, worn worsted cloth, and rack"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/14-break-line.webp"
         alt="Cue-ball-height view down the table toward the racked balls and diamond storefront window"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
  <figure class="shot">
    <img src="img/opening/15-rack-detail.webp"
         alt="Close view of the fifteen-ball rack on worn tournament-green cloth before the break"
         width="1600" height="900" loading="lazy" decoding="async">
  </figure>
</main>
</body>
</html>
